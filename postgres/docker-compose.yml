services:
  db:
    image: postgres:16
    container_name: genomics_tracking_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: genomics_tracking
      POSTGRES_USER: genomics
      POSTGRES_PASSWORD: genomics_dev_only
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/1_schema.sql:ro
      - ./seed_data.sql:/docker-entrypoint-initdb.d/2_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genomics -d genomics_tracking"]
      interval: 5s
      timeout: 5s
      retries: 5
